<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded container -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect width="64" height="64" rx="16" stroke="#10b981" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Interview dialogue bubble -->
  <path d="M16 21C16 17.6863 18.6863 15 22 15H42C45.3137 15 48 17.6863 48 21V35C48 38.3137 45.3137 41 42 41H33L25 48V41H22C18.6863 41 16 38.3137 16 35V21Z" 
        fill="#042f2e" fill-opacity="0.6" stroke="url(#emeraldGrad)" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- AI Voice & Frequency Equalizer Waves -->
  <rect x="22.5" y="26" width="3" height="8" rx="1.5" fill="#34d399"/>
  <rect x="28.5" y="21" width="3" height="18" rx="1.5" fill="url(#emeraldGrad)"/>
  <rect x="34.5" y="24.5" width="3" height="11" rx="1.5" fill="#34d399"/>
  <rect x="40.5" y="27" width="3" height="6" rx="1.5" fill="#10b981"/>

  <!-- AI Intelligence Star Sparkle -->
  <path d="M48 11L49.2 14.8L53 16L49.2 17.2L48 21L46.8 17.2L43 16L46.8 14.8L48 11Z" fill="url(#accentGrad)" filter="url(#glow)"/>
</svg>

